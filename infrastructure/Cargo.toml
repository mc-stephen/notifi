[package]
name = "server"
version.workspace = true
edition.workspace = true
description = "Notifi server — HTTP API, domain logic, and infrastructure in one crate"

[dependencies]
argon2 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
handlebars = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
lapin = { workspace = true }
lettre = { workspace = true }
ipnet = { workspace = true }
rand = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-executor-trait = { workspace = true }
tokio-reactor-trait = { workspace = true }
totp-rs = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
urlencoding = { workspace = true }
web-push = { workspace = true }
yup-oauth2 = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"

[workspace]
resolver = "2"
members = [
  "worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
futures = "0.3"
handlebars = "6"
hex = "0.4"
ipnet = "2"
jsonwebtoken = "9"
lapin = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# TLS note: this deployment's TLS terminators (Coolify) reject rustls
# handshakes and use a private CA, so we use native-tls; rediss:// URLs with
# a #insecure fragment then accept self-signed certs (dev-only compromise).
redis = { version = "0.28", features = ["tokio-comp", "tokio-native-tls-comp", "tls-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "tls-rustls-ring"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-executor-trait = "2"
tokio-reactor-trait = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
totp-rs = { version = "5", features = ["otpauth"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
urlencoding = "2"
web-push = "0.9"
yup-oauth2 = "8"
