[workspace]
resolver = "2"
members = [
  "crates/api",
  "crates/core",
  "crates/domain-ports",
  "crates/infra/config",
  "crates/infra/telemetry",
  "crates/adapters/channels/android_channel",
  "crates/adapters/channels/discord_channel",
  "crates/adapters/channels/email_channel",
  "crates/adapters/channels/ios_channel",
  "crates/adapters/channels/linux_channel",
  "crates/adapters/channels/macos_channel",
  "crates/adapters/channels/slack_channel",
  "crates/adapters/channels/sms_channel",
  "crates/adapters/channels/telegram_channel",
  "crates/adapters/channels/web_channel",
  "crates/adapters/channels/webhook_channel",
  "crates/adapters/channels/whatsapp_channel",
  "crates/adapters/channels/window_channel",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
redis = { version = "0.28", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
