[workspace]
resolver = "2"
members = [
  "server",
  "worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
object_store = { version = "0.14", features = ["aws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
futures = "0.3"
handlebars = "6"
hex = "0.4"
ipnet = "2"
jsonwebtoken = "9"
lapin = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# TLS note: this deployment's TLS terminators (Coolify) reject rustls
# handshakes and use a private CA, so we use native-tls; rediss:// URLs with
# a #insecure fragment then accept self-signed certs (dev-only compromise).
redis = { version = "0.28", features = ["tokio-comp", "tokio-native-tls-comp", "tls-native-tls", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "tls-rustls-ring"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-executor-trait = "2"
tokio-reactor-trait = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
totp-rs = { version = "5", features = ["otpauth"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
web-push = "0.9"
yup-oauth2 = "8"
